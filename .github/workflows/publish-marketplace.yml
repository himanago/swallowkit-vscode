name: Publish VS Code Extension

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to VS Code Marketplace
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

jobs:
  marketplace:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Ensure tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="${{ steps.package.outputs.version }}"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version ($tag_version) does not match package.json version ($package_version)."
            exit 1
          fi

      - name: Type-check
        run: npm run compile

      - name: Build extension
        run: npm run build

      - name: Package VSIX
        run: npx @vscode/vsce package -o swallowkit-vscode-${{ steps.package.outputs.version }}.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: swallowkit-vscode-${{ steps.package.outputs.version }}
          path: swallowkit-vscode-${{ steps.package.outputs.version }}.vsix

      - name: Publish to Marketplace
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if (-not $env:VSCE_PAT) {
            throw "GitHub secret VSCE_PAT is not set."
          }

          npx @vscode/vsce publish
